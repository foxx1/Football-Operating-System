<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional Football Pitch Background - matching reference image -->
  <rect width="1200" height="800" fill="#2d5016" stroke="none"/>
  
  <!-- Realistic grass texture with alternating stripes like reference image -->
  <defs>
    <pattern id="grassTexture" patternUnits="userSpaceOnUse" width="50" height="800">
      <rect width="25" height="800" fill="#2d5016"/>
      <rect x="25" width="25" height="800" fill="#356b1a"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grassTexture)" stroke="none"/>
  
  <!-- Outer boundary with FIFA standard dimensions -->
  <rect x="60" y="60" width="1080" height="680" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Center line -->
  <line x1="600" y1="60" x2="600" y2="740" stroke="white" stroke-width="3"/>
  
  <!-- Center circle (9.15m radius scaled) -->
  <circle cx="600" cy="400" r="85" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Center spot -->
  <circle cx="600" cy="400" r="2" fill="white"/>
  
  <!-- Left penalty area (18-yard box) -->
  <rect x="60" y="240" width="164" height="320" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Right penalty area (18-yard box) -->
  <rect x="976" y="240" width="164" height="320" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Left goal area (6-yard box) -->
  <rect x="60" y="320" width="55" height="160" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Right goal area (6-yard box) -->
  <rect x="1085" y="320" width="55" height="160" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Left penalty spot -->
  <circle cx="170" cy="400" r="2" fill="white"/>
  
  <!-- Right penalty spot -->
  <circle cx="1030" cy="400" r="2" fill="white"/>
  
  <!-- Left penalty arc - properly centered on penalty spot -->
  <path d="M 170,315 A 85,85 0 0,1 170,485" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Right penalty arc - properly centered on penalty spot -->
  <path d="M 1030,315 A 85,85 0 0,0 1030,485" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Corner arcs - quarter circles at each corner -->
  <!-- Top-left corner -->
  <path d="M 60,69 A 9,9 0 0,1 69,60" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Top-right corner -->
  <path d="M 1131,60 A 9,9 0 0,1 1140,69" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Bottom-left corner -->
  <path d="M 69,740 A 9,9 0 0,1 60,731" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Bottom-right corner -->
  <path d="M 1140,731 A 9,9 0 0,1 1131,740" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Goals matching reference image style -->
  <!-- Left goal -->
  <rect x="40" y="365" width="20" height="70" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Right goal -->
  <rect x="1140" y="365" width="20" height="70" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Goal nets with realistic crosshatch pattern -->
  <!-- Left goal net -->
  <g stroke="white" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 40,365 L 30,355 L 30,445 L 40,435"/>
    <line x1="35" y1="360" x2="40" y2="370"/>
    <line x1="35" y1="375" x2="40" y2="385"/>
    <line x1="35" y1="390" x2="40" y2="400"/>
    <line x1="35" y1="405" x2="40" y2="415"/>
    <line x1="35" y1="420" x2="40" y2="430"/>
    <line x1="30" y1="370" x2="40" y2="375"/>
    <line x1="30" y1="385" x2="40" y2="390"/>
    <line x1="30" y1="400" x2="40" y2="405"/>
    <line x1="30" y1="415" x2="40" y2="420"/>
  </g>
  
  <!-- Right goal net -->
  <g stroke="white" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 1160,365 L 1170,355 L 1170,445 L 1160,435"/>
    <line x1="1165" y1="360" x2="1160" y2="370"/>
    <line x1="1165" y1="375" x2="1160" y2="385"/>
    <line x1="1165" y1="390" x2="1160" y2="400"/>
    <line x1="1165" y1="405" x2="1160" y2="415"/>
    <line x1="1165" y1="420" x2="1160" y2="430"/>
    <line x1="1170" y1="370" x2="1160" y2="375"/>
    <line x1="1170" y1="385" x2="1160" y2="390"/>
    <line x1="1170" y1="400" x2="1160" y2="405"/>
    <line x1="1170" y1="415" x2="1160" y2="420"/>
  </g>
</svg>