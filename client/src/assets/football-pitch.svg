<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Football Pitch Background -->
  <rect width="1200" height="800" fill="#4ade80" stroke="none"/>
  
  <!-- Grass stripes for realistic appearance -->
  <defs>
    <pattern id="grassStripes" patternUnits="userSpaceOnUse" width="60" height="800">
      <rect width="30" height="800" fill="#4ade80"/>
      <rect x="30" width="30" height="800" fill="#22c55e"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grassStripes)" stroke="none"/>
  
  <!-- Outer boundary -->
  <rect x="50" y="50" width="1100" height="700" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Center line -->
  <line x1="600" y1="50" x2="600" y2="750" stroke="white" stroke-width="4"/>
  
  <!-- Center circle -->
  <circle cx="600" cy="400" r="91.5" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Center spot -->
  <circle cx="600" cy="400" r="3" fill="white"/>
  
  <!-- Left penalty area (18-yard box) -->
  <rect x="50" y="231" width="165" height="338" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Right penalty area (18-yard box) -->
  <rect x="985" y="231" width="165" height="338" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Left goal area (6-yard box) -->
  <rect x="50" y="322" width="55" height="156" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Right goal area (6-yard box) -->
  <rect x="1095" y="322" width="55" height="156" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Left penalty spot -->
  <circle cx="182" cy="400" r="3" fill="white"/>
  
  <!-- Right penalty spot -->
  <circle cx="1018" cy="400" r="3" fill="white"/>
  
  <!-- Left penalty arc -->
  <path d="M 182,309.5 A 91.5,91.5 0 0,1 182,490.5" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Right penalty arc -->
  <path d="M 1018,309.5 A 91.5,91.5 0 0,0 1018,490.5" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Corner arcs -->
  <!-- Top-left corner -->
  <path d="M 50,68 A 18,18 0 0,1 68,50" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Top-right corner -->
  <path d="M 1132,50 A 18,18 0 0,1 1150,68" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Bottom-left corner -->
  <path d="M 68,750 A 18,18 0 0,1 50,732" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Bottom-right corner -->
  <path d="M 1150,732 A 18,18 0 0,1 1132,750" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Goals -->
  <!-- Left goal -->
  <rect x="32" y="367" width="18" height="66" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Right goal -->
  <rect x="1150" y="367" width="18" height="66" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Goal nets (optional decorative element) -->
  <!-- Left goal net -->
  <path d="M 32,367 L 20,355 L 20,445 L 32,433 M 32,380 L 20,368 M 32,393 L 20,381 M 32,406 L 20,394 M 32,419 L 20,407 M 32,432 L 20,420" 
        stroke="white" stroke-width="1" opacity="0.7" fill="none"/>
  
  <!-- Right goal net -->
  <path d="M 1168,367 L 1180,355 L 1180,445 L 1168,433 M 1168,380 L 1180,368 M 1168,393 L 1180,381 M 1168,406 L 1180,394 M 1168,419 L 1180,407 M 1168,432 L 1180,420" 
        stroke="white" stroke-width="1" opacity="0.7" fill="none"/>
</svg>