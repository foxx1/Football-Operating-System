<svg width="800" height="520" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <!-- Classic Green Field Background -->
  <rect width="800" height="520" fill="#2d7a32" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Darker Green Stripes for Classic Look -->
  <pattern id="stripes" patternUnits="userSpaceOnUse" width="40" height="520">
    <rect width="20" height="520" fill="#2d7a32"/>
    <rect x="20" width="20" height="520" fill="#1e5f21"/>
  </pattern>
  <rect width="800" height="520" fill="url(#stripes)" opacity="0.3"/>
  
  <!-- Outer boundary lines -->
  <rect x="4" y="4" width="792" height="512" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Center line -->
  <line x1="400" y1="4" x2="400" y2="516" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Center circle -->
  <circle cx="400" cy="260" r="80" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="400" cy="260" r="2" fill="#ffffff"/>
  
  <!-- Left penalty area -->
  <rect x="4" y="155" width="132" height="210" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Left goal area -->
  <rect x="4" y="195" width="52" height="130" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Left penalty arc -->
  <path d="M 136 207 A 80 80 0 0 1 136 313" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Left penalty spot -->
  <circle cx="108" cy="260" r="3" fill="#ffffff"/>
  
  <!-- Right penalty area -->
  <rect x="664" y="155" width="132" height="210" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Right goal area -->
  <rect x="744" y="195" width="52" height="130" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Right penalty arc -->
  <path d="M 664 207 A 80 80 0 0 0 664 313" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Right penalty spot -->
  <circle cx="692" cy="260" r="3" fill="#ffffff"/>
  
  <!-- Corner arcs -->
  <path d="M 4 14 A 10 10 0 0 1 14 4" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M 786 4 A 10 10 0 0 1 796 14" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M 796 506 A 10 10 0 0 1 786 516" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M 14 516 A 10 10 0 0 1 4 506" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Goals -->
  <rect x="0" y="220" width="4" height="80" fill="#ffffff"/>
  <rect x="796" y="220" width="4" height="80" fill="#ffffff"/>
  
  <!-- Goal posts -->
  <circle cx="2" cy="220" r="2" fill="#ffffff"/>
  <circle cx="2" cy="300" r="2" fill="#ffffff"/>
  <circle cx="798" cy="220" r="2" fill="#ffffff"/>
  <circle cx="798" cy="300" r="2" fill="#ffffff"/>
</svg>